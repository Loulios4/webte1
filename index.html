<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEBTE1 | Ivanenko Denys</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #101015 url("./webte1-background.jpg") center / cover no-repeat fixed;
      }
      .background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      main {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 24px 20px max(5svh, 16px, env(safe-area-inset-bottom, 0px));
      }
      nav {
        display: flex;
        gap: 16px;
        width: min(100%, 720px);
      }
      nav a {
        flex: 1;
        padding: 22px 12px;
        border: 1px solid #45454d;
        border-radius: 0;
        background: #000;
        color: #eeeef0;
        text-align: center;
        text-decoration: none;
        font-size: 24px;
        font-weight: 700;
        transition: border-color .15s;
      }
      nav a:hover { border-color: #aaaab2; }
      nav a:focus-visible { outline: 2px solid #eeeef0; outline-offset: 4px; }
      @media (max-height: 480px) {
        nav a { padding: 12px; font-size: 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .background { display: none; }
        nav a { transition: none; }
      }
    </style>
  </head>
  <body>
    <video class="background" autoplay muted loop playsinline preload="auto"
      poster="./webte1-background.jpg">
      <source src="./webte1-background.mp4" type="video/mp4" />
    </video>
    <main>
      <nav>
        <a href="Z1_ivanenko/index.html">Z1</a>
        <a href="Z2_ivanenko/index.html">Z2</a>
        <a href="Z3_ivanenko/index.html">Z3</a>
      </nav>
    </main>
  </body>
</html>
