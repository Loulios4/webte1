<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Z čoho sa skladá moje pracovisko</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Z čoho sa skladá moje pracovisko</h1>

    <figure class="hotspot-image">
      <img src="img/desktop.png" alt="Ilustrácia bicykla z pravého boku" width="1200" height="800">

      <div class="hotspot" style="--x: 44%; --y: 57%">
        <button class="hotspot__dot" type="button" aria-label="Monitor"></button>
        <div class="hotspot__panel">
          <h2>Monitor</h2>
          <p>Na monitore robím doslova všetko. Veľká obrazovka mi uľahčuje prácu na školských projektoch.</p>
        </div>
      </div>

      <div class="hotspot hotspot--left" style="--x: 80%; --y: 60%">
        <button class="hotspot__dot" type="button" aria-label="Notebook"></button>
        <div class="hotspot__panel">
          <h2>Notebook</h2>
          <p>Notebook používam na programovanie, prípravu školských zadaní. Môžem na ňom pracovať doma aj na univerzite.</p>
        </div>
      </div>

      <div class="hotspot hotspot--above" style="--x: 48%; --y: 83%">
        <button class="hotspot__dot" type="button" aria-label="Klávesnica"></button>
        <div class="hotspot__panel">
          <h2>Klávesnica</h2>
          <p>Klávesnicu používam na písanie kódu, poznámok a školských prác. Klávesové skratky mi pomáhajú rýchlejšie pracovať v editore.</p>
        </div>
      </div>
    </figure>

    <p>Text pod obrázkom, aby bolo vidieť, čo sa deje s obsahom pod ním.</p>
  </main>

</body> 
</html>
