<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <g id="wheel">
      <circle r="200" fill="none" stroke="#1f1f1f" stroke-width="22"/>
      <circle r="184" fill="none" stroke="#9aa0a6" stroke-width="5"/>
      <g stroke="#9aa0a6" stroke-width="3">
        <line x1="-184" y1="0" x2="184" y2="0"/>
        <line x1="-170" y1="-70.4" x2="170" y2="70.4"/>
        <line x1="-130.1" y1="-130.1" x2="130.1" y2="130.1"/>
        <line x1="-70.4" y1="-170" x2="70.4" y2="170"/>
        <line x1="0" y1="-184" x2="0" y2="184"/>
        <line x1="70.4" y1="-170" x2="-70.4" y2="170"/>
        <line x1="130.1" y1="-130.1" x2="-130.1" y2="130.1"/>
        <line x1="170" y1="-70.4" x2="-170" y2="70.4"/>
      </g>
      <circle r="16" fill="#3a3a3a"/>
    </g>
  </defs>

  <!-- background and shadow -->
  <rect width="1200" height="800" fill="#eef1f4"/>
  <ellipse cx="615" cy="742" rx="440" ry="14" fill="#000" opacity="0.08"/>

  <!-- wheels -->
  <use href="#wheel" x="300" y="520"/>
  <use href="#wheel" x="930" y="520"/>

  <!-- frame -->
  <g stroke="#1d6f8a" stroke-width="18" stroke-linecap="round" fill="none">
    <line x1="300" y1="520" x2="570" y2="545"/>
    <line x1="300" y1="520" x2="520" y2="300"/>
    <line x1="570" y1="545" x2="520" y2="300"/>
    <line x1="520" y1="300" x2="845" y2="268"/>
    <line x1="570" y1="545" x2="868" y2="340"/>
    <line x1="845" y1="268" x2="868" y2="340" stroke-width="26"/>
  </g>

  <!-- fork -->
  <line x1="868" y1="340" x2="930" y2="520" stroke="#2b2b2b" stroke-width="14" stroke-linecap="round"/>

  <!-- seatpost and saddle -->
  <line x1="520" y1="300" x2="505" y2="238" stroke="#6b6b6b" stroke-width="12" stroke-linecap="round"/>
  <path d="M440 226 Q490 206 560 216 Q556 236 505 240 Q455 242 440 226 Z" fill="#222"/>

  <!-- stem and handlebar -->
  <path d="M852 268 L842 192 L792 184" fill="none" stroke="#222" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="792" y1="184" x2="766" y2="184" stroke="#222" stroke-width="20" stroke-linecap="round"/>

  <!-- cassette -->
  <circle cx="300" cy="520" r="40" fill="#c9cdd1" stroke="#4a4a4a" stroke-width="6"/>
  <circle cx="300" cy="520" r="26" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-dasharray="5 4"/>

  <!-- chain -->
  <g stroke="#555" stroke-width="5" stroke-dasharray="7 3" fill="none">
    <line x1="300" y1="480" x2="570" y2="483"/>
    <line x1="570" y1="607" x2="330" y2="635"/>
    <line x1="321" y1="582" x2="302" y2="560"/>
  </g>

  <!-- rear derailleur -->
  <line x1="300" y1="520" x2="324" y2="572" stroke="#2f2f2f" stroke-width="10" stroke-linecap="round"/>
  <rect x="316" y="568" width="28" height="72" rx="10" fill="#2f2f2f"/>
  <circle cx="330" cy="582" r="9" fill="#9aa0a6"/>
  <circle cx="330" cy="626" r="9" fill="#9aa0a6"/>

  <!-- chainring, crank and pedal -->
  <circle cx="570" cy="545" r="66" fill="none" stroke="#4a4a4a" stroke-width="6" stroke-dasharray="4 4"/>
  <circle cx="570" cy="545" r="58" fill="none" stroke="#4a4a4a" stroke-width="8"/>
  <circle cx="570" cy="545" r="22" fill="#4a4a4a"/>
  <line x1="570" y1="545" x2="612" y2="640" stroke="#333" stroke-width="14" stroke-linecap="round"/>
  <rect x="585" y="634" width="56" height="14" rx="4" fill="#222"/>
</svg>
